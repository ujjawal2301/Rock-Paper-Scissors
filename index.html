<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 id="heading">Rock Paper Scissors</h1>

    <div id="choice-box">

        <div class="choice" id="rock">
            <img src="https://rock-paper-scissors-lilac-alpha.vercel.app/static/media/rock.png">
        </div>
        <div class="choice" id="paper">
            <img src="https://rock-paper-scissors-lilac-alpha.vercel.app/static/media/paper.png">
        </div>
        <div class="choice" id="scissors">
            <img src="https://i.pinimg.com/736x/67/eb/fd/67ebfd32e898b4ec3ae4e59ae33832c8.jpg">
        </div>

    </div>

    <div class="score-board">
        <div class="score-user">
            <p id="user-point">0</p>
            <p>You</p>
        </div>
        <div class="score-comp">
            <p id="comp-point">0</p>
            <p>Comp</p>
        </div>
    </div>

    <div class="result">
        <p id="res-board">Pick Your Move</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
